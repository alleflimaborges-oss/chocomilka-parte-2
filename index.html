<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chocomilka · Estoque</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>

    <header class="topo">
        <div class="largura topo__linha">
            <p class="marca">Chocomilka</p>
            <button type="button" class="btn" id="btnNovo">
                <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                Novo produto
            </button>
        </div>
    </header>

    <main id="conteudo" class="largura">

        <section class="panorama" aria-live="polite">
            <h1 id="manchete">Carregando estoque…</h1>
            <p id="subtotal"></p>
        </section>

        <section class="barra" aria-label="Buscar e filtrar">
            <div class="busca">
                <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M14 14l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <label for="busca" class="sr-only">Buscar produto</label>
                <input type="search" id="busca" placeholder="Buscar por nome, categoria ou local" autocomplete="off">
            </div>

            <div class="filtros" role="group" aria-label="Filtrar por situação" id="filtros">
                <button type="button" data-filtro="todos" aria-pressed="true">Todos <span class="n" id="nTodos">0</span></button>
                <button type="button" data-filtro="zerado" aria-pressed="false">Em falta <span class="n" id="nZerado">0</span></button>
                <button type="button" data-filtro="baixo" aria-pressed="false">Repor <span class="n" id="nBaixo">0</span></button>
                <button type="button" data-filtro="ok" aria-pressed="false">Em dia <span class="n" id="nOk">0</span></button>
            </div>

            <div class="ordenar">
                <label for="ordenar">Ordenar</label>
                <select id="ordenar">
                    <option value="urgencia">Mais urgentes primeiro</option>
                    <option value="nome">Nome</option>
                    <option value="categoria">Categoria</option>
                    <option value="quantidade">Menor quantidade</option>
                </select>
            </div>
        </section>

        <ul class="itens" id="lista" aria-label="Produtos em estoque"></ul>

        <!-- Estados vazios e de erro: sempre dizem o que fazer -->
        <section class="vazio" id="vazio" hidden>
            <div class="tablete tablete--grande" aria-hidden="true"></div>
            <h2 id="vazioTitulo"></h2>
            <p id="vazioTexto"></p>
            <div class="vazio__acoes" id="vazioAcoes"></div>
        </section>

        <p class="contagem" id="contagem"></p>
    </main>

    <!-- GAVETA: cadastro / edição -->
    <dialog id="modalForm" class="gaveta" aria-labelledby="modalTitulo">
        <form id="formProduto" novalidate>
            <div class="gaveta__topo">
                <h2 id="modalTitulo">Novo produto</h2>
                <button type="button" class="btn-icone" data-fechar aria-label="Fechar">
                    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
            </div>

            <input type="hidden" id="produtoId">

            <div class="campo">
                <label for="nome">Nome do produto</label>
                <input type="text" id="nome" placeholder="Ex.: Barra ao leite 90 g" maxlength="80" required>
                <span class="erro" id="erro-nome" role="alert"></span>
            </div>

            <div class="campo">
                <label for="categoria">Categoria</label>
                <input type="text" id="categoria" list="listaCategorias" placeholder="Ex.: Barras" maxlength="80" required>
                <datalist id="listaCategorias"></datalist>
                <span class="erro" id="erro-categoria" role="alert"></span>
            </div>

            <div class="campo">
                <label for="localizacao">Onde fica guardado</label>
                <input type="text" id="localizacao" placeholder="Ex.: Prateleira A2" maxlength="80" required>
                <span class="erro" id="erro-localizacao" role="alert"></span>
            </div>

            <div class="grade-2">
                <div class="campo">
                    <label for="quantidade">Quantidade atual</label>
                    <input type="number" id="quantidade" min="0" step="1" inputmode="numeric" placeholder="0" required>
                    <span class="erro" id="erro-quantidade" role="alert"></span>
                </div>
                <div class="campo">
                    <label for="estoque_minimo">Estoque mínimo</label>
                    <input type="number" id="estoque_minimo" min="0" step="1" inputmode="numeric" placeholder="0" required>
                    <span class="erro" id="erro-estoque_minimo" role="alert"></span>
                </div>
            </div>
            <p class="ajuda">Quando a quantidade chegar no mínimo, o produto aparece como “Repor”.</p>

            <div class="gaveta__rodape">
                <button type="button" class="btn btn--sec" data-fechar>Cancelar</button>
                <button type="submit" class="btn" id="btnSalvar">Cadastrar produto</button>
            </div>
        </form>
    </dialog>

    <!-- Confirmação de exclusão -->
    <dialog id="modalExcluir" class="modal" aria-labelledby="excluirTitulo">
        <h2 id="excluirTitulo">Excluir este produto?</h2>
        <p><strong id="excluirNome"></strong> sai do estoque e não dá para desfazer.</p>
        <div class="modal__rodape">
            <button type="button" class="btn btn--sec" data-fechar>Manter produto</button>
            <button type="button" class="btn btn--perigo" id="btnConfirmarExcluir">Excluir produto</button>
        </div>
    </dialog>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
